
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🌤 Weather App</h1>

        <div class="search">
            <input type="text" id="cityInput" placeholder="Enter city name">
            <button onclick="getWeather()">Search</button>
        </div>

        <div class="weather">
            <h2 id="city">Karachi</h2>
            <h1 id="temperature">--°C</h1>
            <p id="condition">Search a city to see weather</p>
        </div>

        <div class="details">
            <div>
                <h3 id="humidity">--%</h3>
                <p>Humidity</p>
            </div>
            <div>
                <h3 id="wind">-- km/h</h3>
                <p>Wind Speed</p>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
