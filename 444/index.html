<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Search -->
        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Search for a city..."
            >

            <button id="searchBtn">
                🔍 Search
            </button>

        </div>


        <!-- Main Weather Card -->
        <div class="weather-card">

            <div class="top-section">

                <div>
                    <h1 id="cityName">Karachi</h1>

                    <p id="date">
                        Friday, 20 November
                    </p>
                </div>

                <div class="location">
                    📍
                </div>

            </div>


            <!-- Temperature -->
            <div class="main-weather">

                <div class="weather-icon" id="weatherIcon">
                    ☀️
                </div>

                <div class="temperature">

                    <h2 id="temperature">
                        28°
                    </h2>

                    <p id="condition">
                        Sunny
                    </p>

                </div>

            </div>


            <!-- Weather Details -->
            <div class="details">

                <div class="detail-box">

                    <span>💧</span>

                    <div>
                        <p>Humidity</p>

                        <h3 id="humidity">
                            65%
                        </h3>
                    </div>

                </div>


                <div class="detail-box">

                    <span>💨</span>

                    <div>
                        <p>Wind</p>

                        <h3 id="wind">
                            12 km/h
                        </h3>
                    </div>

                </div>


                <div class="detail-box">

                    <span>🌡️</span>

                    <div>
                        <p>Feels Like</p>

                        <h3 id="feelsLike">
                            30°
                        </h3>
                    </div>

                </div>

            </div>

        </div>


        <!-- Forecast -->
        <div class="forecast-section">

            <h2>
                5-Day Forecast
            </h2>


            <div class="forecast-container">

                <div class="forecast-card">

                    <p>Sat</p>

                    <span>☀️</span>

                    <h3>29°</h3>

                    <small>Sunny</small>

                </div>


                <div class="forecast-card">

                    <p>Sun</p>

                    <span>🌤️</span>

                    <h3>30°</h3>

                    <small>Partly Cloudy</small>

                </div>


                <div class="forecast-card">

                    <p>Mon</p>

                    <span>☁️</span>

                    <h3>27°</h3>

                    <small>Cloudy</small>

                </div>


                <div class="forecast-card">

                    <p>Tue</p>

                    <span>🌧️</span>

                    <h3>25°</h3>

                    <small>Rainy</small>

                </div>


                <div class="forecast-card">

                    <p>Wed</p>

                    <span>☀️</span>

                    <h3>28°</h3>

                    <small>Sunny</small>

                </div>

            </div>

        </div>


        <!-- Footer -->
        <footer>
            <p>Weather App © 2026</p>
        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
