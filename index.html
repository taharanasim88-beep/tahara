
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>

    <style>
        body {
            background-color: lightblue;
            text-align: center;
            padding-top: 100px;
            font-family: Arial;
        }

        h1 {
            color: darkblue;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>My Counter</h1>

    <h2 id="count">0</h2>

    <button id="increase">Increase +</button>
    <button id="decrease">Decrease -</button>
    <button id="reset">Reset</button>

    <script src="index.js"></script>

</body>
</html>
